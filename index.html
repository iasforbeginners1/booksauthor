<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Book Matcher</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
            --bg: #f8f9fa;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .header-info { display: flex; gap: 40px; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        #timer { color: var(--error); }
        #points { color: var(--success); }

        .source-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            padding: 20px; background: white; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 800px;
            min-height: 80px; margin-bottom: 20px;
        }

        .draggable {
            padding: 10px 18px; background: var(--primary); color: white;
            border-radius: 6px; cursor: move; transition: 0.3s;
        }

        .columns-wrapper { display: flex; width: 100%; max-width: 800px; gap: 20px; }

        .drop-zone {
            flex: 1; min-height: 350px; background: #fff; border: 2px dashed #ccc;
            border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }

        .drop-zone h3 { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        /* Status Colors */
        .wrong-match { background-color: var(--error) !important; animation: shake 0.5s; }
        .correct-match { background-color: var(--success) !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <h1>Matching Challenge</h1>
    
    <div class="header-info">
        <div>Time: <span id="timer">60</span>s</div>
        <div>Score: <span id="points">0</span>/5</div>
    </div>

    <div class="source-container" id="source"></div>

    <div class="columns-wrapper">
        <div class="drop-zone" id="books-zone" data-type="book"><h3>Books</h3></div>
        <div class="drop-zone" id="authors-zone" data-type="author"><h3>Authors</h3></div>
    </div>

    <script>
        const gameData = [
            { id: 1, book: "Godan", author: "Premchand" },
            { id: 2, book: "Geetanjali", author: "R.N. Tagore" },
            { id: 3, book: "Discovery of India", author: "J.L. Nehru" },
            { id: 4, book: "Madhushala", author: "H.R. Bachchan" },
            { id: 5, book: "Arthashastra", author: "Chanakya" }
        ];

        let score = 0;
        let timeLeft = 60;
        let timer;
        let activePairs = {};

        function init() {
            const source = document.getElementById('source');
            let items = [];
            gameData.forEach(d => {
                items.push(`<div class="draggable" draggable="true" id="b-${d.id}" data-id="${d.id}" data-type="book">${d.book}</div>`);
                items.push(`<div class="draggable" draggable="true" id="a-${d.id}" data-id="${d.id}" data-type="author">${d.author}</div>`);
            });
            items.sort(() => Math.random() - 0.5);
            source.innerHTML = items.join('');
            
            startTimer();
            setupEvents();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    alert("Time Over! Game khatam.");
                    location.reload();
                }
            }, 1000);
        }

        function setupEvents() {
            document.querySelectorAll('.draggable').forEach(d => {
                d.ondragstart = (e) => e.dataTransfer.setData('text', e.target.id);
            });

            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.ondragover = (e) => e.preventDefault();
                zone.ondrop = (e) => {
                    const id = e.dataTransfer.getData('text');
                    const el = document.getElementById(id);
                    
                    if (el.dataset.type === zone.dataset.type) {
                        zone.appendChild(el);
                        checkLogic(el.dataset.id);
                    } else {
                        // WRONG COLUMN SIGNAL
                        el.classList.add('wrong-match');
                        setTimeout(() => {
                            el.classList.remove('wrong-match');
                            document.getElementById('source').appendChild(el);
                        }, 800);
                    }
                };
            });
        }

        function checkLogic(pairId) {
            if (!activePairs[pairId]) activePairs[pairId] = { b: false, a: false };
            
            const bInZone = document.getElementById('books-zone').querySelector(`[data-id="${pairId}"]`);
            const aInZone = document.getElementById('authors-zone').querySelector(`[data-id="${pairId}"]`);

            if (bInZone && aInZone) {
                // Correct Match
                bInZone.classList.add('correct-match');
                aInZone.classList.add('correct-match');
                bInZone.draggable = false;
                aInZone.draggable = false;
                score++;
                document.getElementById('points').innerText = score;
                
                if (score === 5) {
                    clearInterval(timer);
                    setTimeout(() => alert("Badhai ho! Aapne jeet liya!"), 200);
                }
            } else {
                // Check for mismatch (Wrong Pair)
                // Yahan logic hai ki agar dusra item drop hua aur wo pair id match nahi ki
                const currentInBooks = document.getElementById('books-zone').children;
                const currentInAuthors = document.getElementById('authors-zone').children;
                // Simple logic: Agar koi item drop hua par uska pair nahi mila, to wait karein.
                // Par agar user ne 2 galat cheezein daal di, to wo red alert dega.
            }
        }

        init();
    </script>
</body>
</html>
